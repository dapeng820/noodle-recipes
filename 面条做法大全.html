<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>面条做法大全</title>
<style>
/* ========== 全局重置 & 基础 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f0eb; color: #333; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #fff; position: relative; overflow: hidden; padding-bottom: 60px; }

/* ========== 颜色变量 ========== */
:root {
  --primary: #E8733A;
  --primary-light: #FFB347;
  --blue: #4A90D9;
  --green: #2ECC71;
  --bg: #fdf8f4;
  --card-bg: #fff;
  --text: #333;
  --text-light: #888;
  --border: #f0e8e0;
  --shadow: 0 2px 12px rgba(232,115,58,0.1);
  --radius: 12px;
}

/* ========== 页面容器 ========== */
.page { display: none; padding: 16px; padding-top: 8px; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

/* ========== 底部Tab导航 ========== */
.tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 480px; width: 100%; height: 56px; background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 1000; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #999; cursor: pointer; transition: color 0.2s; }
.tab-item .tab-icon { font-size: 22px; line-height: 1.2; }
.tab-item.active { color: var(--primary); }
.tab-item:active { opacity: 0.7; }

/* ========== 通用组件 ========== */
.section-title { font-size: 18px; font-weight: 700; margin: 16px 0 12px; display: flex; align-items: center; justify-content: space-between; }
.section-title .more { font-size: 13px; color: var(--primary); font-weight: 400; cursor: pointer; }
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; margin-right: 6px; }
.tag-easy { background: #e8f5e9; color: #2e7d32; }
.tag-medium { background: #fff3e0; color: #e65100; }
.tag-hard { background: #fce4ec; color: #c62828; }
.tag-popular { background: #fff0f0; color: #e74c3c; }
.tag-cat { background: #fef3e8; color: var(--primary); }

/* ========== 图片样式 ========== */
.recipe-img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.recipe-img-round { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
.recipe-img-bg { background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.step-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.know-thumb { width: 100%; height: 100px; object-fit: cover; display: block; }
.cover-thumb { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.detail-cover { width: 120px; height: 120px; border-radius: 16px; object-fit: cover; margin: 0 auto 12px; display: block; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.hot-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ========== 视频容器 ========== */
.video-container { width: 100%; border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; position: relative; background: #1a1a2e; }
.video-container iframe { width: 100%; height: 200px; border: none; display: block; }
.video-container .video-fallback { width: 100%; height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; cursor: pointer; background: #1a1a2e; }
.video-container .video-fallback .vp-icon { font-size: 48px; margin-bottom: 8px; }
.video-container .video-fallback .vp-text { font-size: 13px; opacity: 0.7; }
.btn-primary { background: var(--primary); color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
.btn-primary:active { opacity: 0.8; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

/* ========== 首页 ========== */
/* 轮播图 */
.carousel { position: relative; border-radius: var(--radius); overflow: hidden; height: 180px; margin-bottom: 16px; }
.carousel-slide { position: absolute; inset: 0; display: flex; transition: transform 0.5s ease; }
.carousel-item { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #fff; padding: 24px; text-align: center; }
.carousel-item:nth-child(1) { background: linear-gradient(135deg, #E8733A, #FFB347); }
.carousel-item:nth-child(2) { background: linear-gradient(135deg, #4A90D9, #6BB5FF); }
.carousel-item:nth-child(3) { background: linear-gradient(135deg, #2ECC71, #82E0AA); }
.carousel-item .carousel-emoji { font-size: 48px; margin-bottom: 8px; }
.carousel-item .carousel-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.carousel-item .carousel-desc { font-size: 13px; opacity: 0.9; }
.carousel-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; }
.carousel-dot.active { background: #fff; width: 24px; border-radius: 4px; }

/* 热门教程横向滚动 */
.hot-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 12px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.hot-scroll::-webkit-scrollbar { display: none; }
.hot-card { min-width: 140px; scroll-snap-align: start; background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; flex-shrink: 0; }
.hot-card .hot-cover { height: 90px; overflow: hidden; background: var(--bg); }
.hot-card .hot-info { padding: 8px 10px; }
.hot-card .hot-info .hot-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hot-card .hot-info .hot-meta { font-size: 11px; color: var(--text-light); margin-top: 2px; }

/* 分类入口网格 */
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.cat-item { display: flex; flex-direction: column; align-items: center; padding: 14px 8px; background: var(--bg); border-radius: var(--radius); cursor: pointer; transition: transform 0.2s; }
.cat-item:active { transform: scale(0.95); }
.cat-item .cat-icon { font-size: 32px; margin-bottom: 6px; }
.cat-item .cat-label { font-size: 12px; color: var(--text); }

/* 小贴士预览 */
.tip-preview { background: linear-gradient(135deg, #fef3e8, #fff8f0); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; cursor: pointer; }
.tip-preview .tip-p-title { font-size: 15px; font-weight: 600; color: var(--primary); margin-bottom: 6px; }
.tip-preview .tip-p-desc { font-size: 13px; color: #666; }

/* ========== 知识库 ========== */
.know-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.know-card { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
.know-card .know-cover { height: 100px; overflow: hidden; }
.know-card .know-body { padding: 12px; }
.know-card .know-body .know-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.know-card .know-body .know-count { font-size: 12px; color: var(--text-light); }
.know-card:active { opacity: 0.85; }

/* 知识库详情列表 */
.know-detail-list .know-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.know-detail-list .know-item:last-child { border-bottom: none; }
.know-item .ki-icon { font-size: 32px; flex-shrink: 0; }
.know-item .ki-info { flex: 1; }
.know-item .ki-info .ki-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.know-item .ki-info .ki-desc { font-size: 13px; color: #666; line-height: 1.5; }

/* ========== 教程分类页 ========== */
.cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; -webkit-overflow-scrolling: touch; }
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); font-size: 13px; white-space: nowrap; cursor: pointer; transition: all 0.2s; flex-shrink: 0; background: #fff; }
.cat-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.cat-tab:active { opacity: 0.7; }

/* 教程卡片列表 */
.tutorial-list .t-card { display: flex; gap: 12px; padding: 12px; background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 1px 6px rgba(0,0,0,0.05); margin-bottom: 12px; cursor: pointer; }
.t-card .tc-cover { width: 80px; height: 80px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0; background: var(--bg); }
.t-card .tc-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.t-card .tc-info .tc-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.t-card .tc-info .tc-meta { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.t-card .tc-info .tc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.t-card:active { opacity: 0.85; }

/* ========== 教程详情 ========== */
.detail-header { text-align: center; padding: 20px 0; }
.detail-header .dh-emoji { font-size: 64px; margin-bottom: 8px; }
.detail-header .dh-name { font-size: 24px; font-weight: 700; }
.detail-header .dh-cat { font-size: 13px; color: var(--primary); margin-top: 4px; }

.detail-meta { display: flex; justify-content: center; gap: 24px; padding: 12px 0; margin-bottom: 16px; }
.detail-meta .dm-item { text-align: center; }
.detail-meta .dm-item .dm-num { font-size: 18px; font-weight: 700; color: var(--primary); }
.detail-meta .dm-item .dm-label { font-size: 12px; color: var(--text-light); }

.detail-actions { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
.detail-actions .da-btn { padding: 8px 24px; border-radius: 20px; border: 1px solid var(--border); font-size: 14px; cursor: pointer; background: #fff; display: flex; align-items: center; gap: 4px; }
.detail-actions .da-btn:active { opacity: 0.7; }
.detail-actions .da-btn.fav-active { background: #fff0f0; border-color: #e74c3c; color: #e74c3c; }

/* 食材清单 */
.ingredient-list { display: flex; flex-wrap: wrap; gap: 8px; }
.ingredient-list .ing-item { padding: 6px 14px; background: var(--bg); border-radius: 20px; font-size: 13px; }

/* 分步教学 */
.step-list { counter-reset: step; }
.step-item { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
.step-item:last-child { border-bottom: none; }
.step-item .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.step-item .step-img { width: 60px; height: 60px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
.step-item .step-desc { flex: 1; font-size: 14px; line-height: 1.6; padding-top: 4px; }

/* 避坑总结 */
.tips-list .tip-item { display: flex; gap: 8px; padding: 8px 0; font-size: 14px; line-height: 1.5; }
.tips-list .tip-item .tip-bullet { color: var(--primary); font-weight: 700; flex-shrink: 0; }

/* ========== 搜索页 ========== */
.search-box { display: flex; gap: 8px; margin-bottom: 16px; }
.search-box input { flex: 1; padding: 10px 16px; border: 2px solid var(--border); border-radius: 24px; font-size: 14px; outline: none; transition: border-color 0.2s; }
.search-box input:focus { border-color: var(--primary); }
.search-box .search-btn { padding: 10px 20px; border-radius: 24px; border: none; background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; }

.hot-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.hot-tags .hot-tag { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 13px; cursor: pointer; background: #fff; }
.hot-tags .hot-tag:active { background: var(--bg); }

/* ========== 个人中心 ========== */
.profile-header { text-align: center; padding: 24px 0; }
.profile-header .ph-avatar { font-size: 64px; margin-bottom: 8px; }
.profile-header .ph-name { font-size: 18px; font-weight: 600; }
.profile-header .ph-desc { font-size: 13px; color: var(--text-light); margin-top: 4px; }

.profile-menu { display: flex; flex-direction: column; gap: 8px; }
.profile-menu .pm-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 1px 4px rgba(0,0,0,0.04); cursor: pointer; }
.profile-menu .pm-item:active { background: var(--bg); }
.profile-menu .pm-item .pm-icon { font-size: 24px; }
.profile-menu .pm-item .pm-label { flex: 1; font-size: 14px; }
.profile-menu .pm-item .pm-arrow { color: #ccc; font-size: 16px; }

/* ========== 小贴士页 ========== */
.tip-full-item { padding: 16px; background: var(--card-bg); border-radius: var(--radius); box-shadow: 0 1px 6px rgba(0,0,0,0.05); margin-bottom: 12px; }
.tip-full-item .tfi-title { font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.tip-full-item .tfi-body { font-size: 14px; line-height: 1.7; color: #555; }

/* ========== 回到顶部 ========== */
.back-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); font-size: 14px; cursor: pointer; padding: 8px 0; margin-bottom: 4px; }
.back-btn:active { opacity: 0.7; }

/* ========== 响应式大屏 ========== */
@media (min-width: 481px) {
  .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); box-shadow: 0 0 30px rgba(0,0,0,0.05); }
  .carousel { height: 220px; }
  .hot-card { min-width: 180px; }
  .hot-card .hot-cover { height: 110px; }
}

/* ========== 滚动条美化 ========== */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

/* ========== 图片Lightbox大图查看 ========== */
.lightbox-overlay {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.92);
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.lightbox-overlay.active {
  display: flex;
}
.lightbox-overlay .lightbox-img {
  max-width: 92%;
  max-height: 92%;
  border-radius: 8px;
  object-fit: contain;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  cursor: default;
}
.lightbox-overlay .lightbox-close {
  position: absolute;
  top: 20px;
  right: 20px;
  color: #fff;
  font-size: 36px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  z-index: 10000;
  user-select: none;
}
.lightbox-overlay .lightbox-close:hover {
  background: rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ==================== 首页 ==================== -->
<div class="page active" id="page-home">
  <div class="carousel" id="homeCarousel">
    <div class="carousel-slide" id="carouselSlide">
      <div class="carousel-item">
        <div class="carousel-emoji">🍜</div>
        <div class="carousel-title">面条做法大全</div>
        <div class="carousel-desc">从入门到精通，一碗好面的全部秘密</div>
      </div>
      <div class="carousel-item">
        <div class="carousel-emoji">👨‍🍳</div>
        <div class="carousel-title">大师配方</div>
        <div class="carousel-desc">20+道经典面条教程，在家做出馆子味道</div>
      </div>
      <div class="carousel-item">
        <div class="carousel-emoji">💡</div>
        <div class="carousel-title">实用小贴士</div>
        <div class="carousel-desc">煮面不坨、面条劲道的秘诀全在这里</div>
      </div>
    </div>
    <div class="carousel-dots" id="carouselDots"></div>
  </div>

  <div class="section-title">🔥 热门教程 <span class="more" onclick="navigate('tutorials')">查看全部 &gt;</span></div>
  <div class="hot-scroll" id="hotScroll"></div>

  <div class="section-title">📂 分类快速入口</div>
  <div class="cat-grid" id="catGrid"></div>

  <div class="section-title">💡 小贴士 <span class="more" onclick="navigate('tips')">查看全部 &gt;</span></div>
  <div id="tipPreview"></div>
</div>

<!-- ==================== 知识库 ==================== -->
<div class="page" id="page-knowledge">
  <div class="section-title" style="margin-top:0;">📚 面条知识库</div>
  <div class="know-grid" id="knowGrid"></div>
</div>

<!-- 知识库详情（子页面） -->
<div class="page" id="page-knowledge-detail" style="display:none;">
  <div class="back-btn" onclick="navigate('knowledge')">← 返回知识库</div>
  <div class="section-title" id="kdTitle" style="margin-top:0;"></div>
  <div class="know-detail-list" id="kdList"></div>
</div>

<!-- ==================== 教程分类 ==================== -->
<div class="page" id="page-tutorials">
  <div class="section-title" style="margin-top:0;">📖 教程分类</div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="tutorial-list" id="tutorialList"></div>
</div>

<!-- ==================== 教程详情 ==================== -->
<div class="page" id="page-detail">
  <div class="back-btn" onclick="navigate('tutorials')">← 返回教程</div>
  <div id="detailContent"></div>
</div>

<!-- ==================== 搜索 ==================== -->
<div class="page" id="page-search">
  <div class="section-title" style="margin-top:0;">🔍 搜索</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索面条名称、分类..." onkeydown="if(event.key==='Enter') doSearch()">
    <button class="search-btn" onclick="doSearch()">搜索</button>
  </div>
  <div class="section-title" style="font-size:14px;margin-bottom:8px;">🏷️ 热门搜索</div>
  <div class="hot-tags" id="hotTags"></div>
  <div class="tutorial-list" id="searchResults"></div>
</div>

<!-- ==================== 个人中心 ==================== -->
<div class="page" id="page-profile">
  <div class="profile-header">
    <div class="ph-avatar">👩‍🍳</div>
    <div class="ph-name">面条爱好者</div>
    <div class="ph-desc">已收藏 <span id="favCount">0</span> 道教程</div>
  </div>
  <div class="profile-menu">
    <div class="pm-item" onclick="showFavorites()">
      <span class="pm-icon">❤️</span>
      <span class="pm-label">我的收藏</span>
      <span class="pm-arrow">›</span>
    </div>
    <div class="pm-item" onclick="showHistory()">
      <span class="pm-icon">📖</span>
      <span class="pm-label">浏览记录</span>
      <span class="pm-arrow">›</span>
    </div>
    <div class="pm-item" onclick="navigate('tips')">
      <span class="pm-icon">💡</span>
      <span class="pm-label">面条小贴士</span>
      <span class="pm-arrow">›</span>
    </div>
    <div class="pm-item" onclick="document.getElementById('msgInput').style.display='block'">
      <span class="pm-icon">✉️</span>
      <span class="pm-label">留言反馈</span>
      <span class="pm-arrow">›</span>
    </div>
  </div>
  <div id="msgInput" style="display:none;margin-top:12px;">
    <textarea id="msgText" style="width:100%;height:80px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;resize:none;outline:none;" placeholder="写下你的建议或想法..."></textarea>
    <button class="btn-primary" style="margin-top:8px;width:100%;" onclick="alert('感谢你的反馈！')">提交反馈</button>
  </div>
</div>

<!-- 收藏/历史列表弹窗 -->
<div class="page" id="page-fav-list">
  <div class="back-btn" id="favBack" onclick="navigate('profile')">← 返回</div>
  <div class="section-title" id="favListTitle" style="margin-top:0;"></div>
  <div class="tutorial-list" id="favListContent"></div>
</div>

<!-- ==================== 小贴士 ==================== -->
<div class="page" id="page-tips">
  <div class="back-btn" onclick="navigate('home')">← 返回首页</div>
  <div class="section-title" style="margin-top:0;">💡 面条小贴士大全</div>
  <div id="tipFullList"></div>
</div>

<!-- ==================== 底部Tab导航 ==================== -->
<div class="tab-bar">

/* ========================================================================
   localStorage 工具
   ======================================================================== */
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('noodle_favs') || '[]'); }
  catch(e) { return []; }
}
function setFavorites(favs) {
  localStorage.setItem('noodle_favs', JSON.stringify(favs));
}
function isFavorite(id) {
  return getFavorites().includes(id);
}
function toggleFavorite(id) {
  let favs = getFavorites();
  if (favs.includes(id)) {
    favs = favs.filter(f => f !== id);
  } else {
    favs.push(id);
  }
  setFavorites(favs);
  return favs.includes(id);
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('noodle_history') || '[]'); }
  catch(e) { return []; }
}
function addHistory(id) {
  let h = getHistory();
  h = h.filter(x => x !== id);
  h.unshift(id);
  if (h.length > 50) h = h.slice(0, 50);
  localStorage.setItem('noodle_history', JSON.stringify(h));
}

/* ========================================================================
   路由
   ======================================================================== */
function navigate(page, params) {
  let hash = '#' + page;
  if (params) hash += '?' + new URLSearchParams(params).toString();
  window.location.hash = hash;
}

function handleRoute() {
  const hash = window.location.hash.slice(1) || 'home';
  const [page, queryStr] = hash.split('?');
  const params = Object.fromEntries(new URLSearchParams(queryStr));

  // 隐藏所有页面
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  // 更新tab高亮
  document.querySelectorAll('.tab-item').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === page);
  });

  // 根据页面显示
  switch(page) {
    case 'home': renderHome(); break;
    case 'knowledge': renderKnowledge(); break;
    case 'knowledge-detail': renderKnowledgeDetail(params.type); break;
    case 'tutorials': renderTutorials(); break;
    case 'detail': renderDetail(params.id); break;
    case 'search': renderSearch(); break;
    case 'profile': renderProfile(); break;
    case 'fav-list': renderFavList(params.mode); break;
    case 'tips': renderTips(); break;
    default: navigate('home'); return;
  }

  // 显示当前页面
  const el = document.getElementById('page-' + page);
  if (el) el.classList.add('active');
  else {
    const el2 = document.getElementById('page-home');
    if (el2) el2.classList.add('active');
  }

  // 滚动到顶部
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', handleRoute);

/* ========================================================================
   首页
   ======================================================================== */
let carouselTimer = null;
let carouselIndex = 0;

function renderHome() {
  // 轮播图
  const dots = document.getElementById('carouselDots');
  dots.innerHTML = '<span class="carousel-dot active"></span><span class="carousel-dot"></span><span class="carousel-dot"></span>';
  carouselIndex = 0;
  startCarousel();

  // 热门教程
  const hotScroll = document.getElementById('hotScroll');
  const sorted = [...RECIPES].sort((a,b) => b.popularity - a.popularity).slice(0, 8);
  hotScroll.innerHTML = sorted.map(r => `
    <div class="hot-card" onclick="navigate('detail', {id:${r.id}})">
      <div class="hot-cover recipe-img-bg"><img class="hot-thumb" src="${r.coverImg}" alt="${r.name}" loading="lazy"></div>
      <div class="hot-info">
        <div class="hot-name">${r.name}</div>
        <div class="hot-meta">❤️ ${r.popularity} | ${r.duration}分钟</div>
      </div>
    </div>
  `).join('');

  // 分类入口
  const catGrid = document.getElementById('catGrid');
  const CAT_ICONS = ['🍜', '🥢', '🥣', '🌍', '🍝', '🌾'];
  catGrid.innerHTML = CATEGORIES.map((c, i) => `
    <div class="cat-item" onclick="navigate('tutorials');setTimeout(()=>filterByCategory('${c}'),100)">
      <span class="cat-icon">${CAT_ICONS[i]}</span>
      <span class="cat-label">${c}</span>
    </div>
  `).join('');

  // 小贴士预览
  const tipPreview = document.getElementById('tipPreview');
  const tips = TIPS_DATA.slice(0, 3);
  tipPreview.innerHTML = tips.map(t => `
    <div class="tip-preview" onclick="navigate('tips')">
      <div class="tip-p-title">${t.title}</div>
      <div class="tip-p-desc">${t.content.slice(0, 40)}...</div>
    </div>
  `).join('');
}

function startCarousel() {
  if (carouselTimer) clearInterval(carouselTimer);
  carouselTimer = setInterval(() => {
    carouselIndex = (carouselIndex + 1) % 3;
    updateCarousel();
  }, 4000);
}

function updateCarousel() {
  const slide = document.getElementById('carouselSlide');
  slide.style.transform = `translateX(-${carouselIndex * 100}%)`;
  document.querySelectorAll('.carousel-dot').forEach((d, i) => {
    d.classList.toggle('active', i === carouselIndex);
  });
}

// 点击轮播图控制
document.addEventListener('click', function(e) {
  const dot = e.target.closest('.carousel-dot');
  if (dot) {
    const idx = Array.from(document.querySelectorAll('.carousel-dot')).indexOf(dot);
    carouselIndex = idx;
    updateCarousel();
    if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
    startCarousel();
  }
});

let currentCatFilter = '全部';

function renderTutorials() {
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = ['全部', ...CATEGORIES].map(c => `
    <div class="cat-tab ${c === currentCatFilter ? 'active' : ''}" onclick="filterByCategory('${c}')">${c}</div>
  `).join('');

}

function filterByCategory(cat) {
  currentCatFilter = cat;
  renderTutorials();
}

function renderTutorialList() {
  const list = document.getElementById('tutorialList');
  let filtered = currentCatFilter === '全部' ? [...RECIPES] : RECIPES.filter(r => r.category === currentCatFilter);
  list.innerHTML = filtered.map(r => `
    <div class="t-card" onclick="navigate('detail', {id:${r.id}})">
      <div class="tc-cover recipe-img-bg"><img class="cover-thumb" src="${r.coverImg}" alt="${r.name}" loading="lazy"></div>
      <div class="tc-info">
        <div class="tc-name">${r.name}</div>
        <div class="tc-meta">
          ❤️ ${r.popularity} &nbsp;|&nbsp; ⏱ ${r.duration}分钟 &nbsp;|&nbsp; 👥 ${r.servings}人
        </div>
        <div class="tc-tags">
          <span class="tag ${r.difficulty === '简单' ? 'tag-easy' : r.difficulty === '中等' ? 'tag-medium' : 'tag-hard'}">${r.difficulty}</span>
          <span class="tag tag-cat">${r.category}</span>
        </div>

/* ========================================================================
   教程详情
   ======================================================================== */

// 根据步骤描述关键词映射步骤图片
function getStepImage(desc) {
  if (/切|洗|准备/.test(desc)) return 'assets/steps/cutting.jpg';
  if (/揉|和|醒/.test(desc)) return 'assets/steps/kneading.jpg';
  if (/擀|拉|削/.test(desc)) return 'assets/steps/rolling.jpg';
  if (/煮|焯|烫/.test(desc)) return 'assets/steps/boiling.jpg';
  if (/炒|翻|煎/.test(desc)) return 'assets/steps/stir_fry.jpg';
  if (/调|酱|汁/.test(desc)) return 'assets/steps/sauce.jpg';
  if (/捞|盛|浇|撒|放/.test(desc)) return 'assets/steps/serving.jpg';
  return 'assets/steps/prep.jpg';
}

/* ========================================================================
   图片Lightbox大图查看
   ======================================================================== */
function openLightbox(src) {
  const overlay = document.getElementById('lightboxOverlay');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  if (e) e.stopPropagation();
  const overlay = document.getElementById('lightboxOverlay');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

function renderDetail(id) {

  if (!recipe) { navigate('tutorials'); return; }

  addHistory(Number(id));

  const fav = isFavorite(recipe.id);
  const container = document.getElementById('detailContent');
  container.innerHTML = `
    <div class="detail-header">
      <div class="dh-emoji"><img class="detail-cover" src="${recipe.coverImg}" alt="${recipe.name}" onclick="openLightbox('${recipe.coverImg}')" style="cursor:pointer;"></div>
      <div class="dh-name">${recipe.name}</div>
      <div class="dh-cat">${recipe.category}</div>
    </div>

    <div class="detail-meta">
      <div class="dm-item">
        <div class="dm-num">${recipe.difficulty}</div>
        <div class="dm-label">难度</div>
      </div>
      <div class="dm-item">
        <div class="dm-num">${recipe.duration}</div>
        <div class="dm-label">分钟</div>
      </div>
      <div class="dm-item">
        <div class="dm-num">${recipe.servings}</div>
        <div class="dm-label">人份</div>
      </div>
      <div class="dm-item">
        <div class="dm-num">❤️ ${recipe.popularity}</div>
        <div class="dm-label">热度</div>
      </div>
    </div>

    <div class="detail-actions">
      <button class="da-btn ${fav ? 'fav-active' : ''}" onclick="toggleFavBtn(${recipe.id})">
        ${fav ? '❤️ 已收藏' : '🤍 收藏'}
      </button>
      <button class="da-btn" onclick="shareRecipe('${recipe.name}')">📤 分享</button>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0;">📋 食材清单</div>
      <div class="ingredient-list">
        ${recipe.ingredients.map(i => `<span class="ing-item">${i}</span>`).join('')}
      </div>
    </div>

    <div class="video-container">
      ${recipe.videoId ? `
        <iframe src="https://player.bilibili.com/player.html?bvid=${recipe.videoId}&page=1&autoplay=0" allowfullscreen="true" loading="lazy" scrolling="no" border="0" frameborder="no" framespacing="0"></iframe>
      ` : `
        <div class="video-fallback" onclick="alert('视频教程准备中')">
          <div class="vp-icon">▶️</div>
          <div class="vp-text">视频教程准备中</div>
        </div>
      `}
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0;">👩‍🍳 分步教学</div>
      <div class="step-list">
        ${recipe.steps.map((s, i) => `
          <div class="step-item">
            <div class="step-num">${i + 1}</div>
            <div class="step-img"><img class="step-thumb" src="${getStepImage(s.desc)}" alt="步骤图片" loading="lazy" onclick="openLightbox('${getStepImage(s.desc)}')" style="cursor:pointer;"></div>
            <div class="step-desc">${s.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0;">⚠️ 避坑总结</div>

          <div class="tip-item"><span class="tip-bullet">💡</span> ${t}</div>

function toggleFavBtn(id) {
  const now = toggleFavorite(id);
  const btns = document.querySelectorAll('.da-btn');
  if (btns.length > 0) {
    btns[0].classList.toggle('fav-active', now);
    btns[0].innerHTML = now ? '❤️ 已收藏' : '🤍 收藏';
  }
  renderProfile();
}

function shareRecipe(name) {
  if (navigator.share) {
    navigator.share({ title: name, text: `快来学做${name}！`, url: window.location.href });
  } else {
    prompt('复制链接分享：', window.location.href);
  }
}

/* ========================================================================
   搜索
   ======================================================================== */
function renderSearch() {
  const hotTags = document.getElementById('hotTags');
  const hotSearches = ['西红柿鸡蛋面', '红烧牛肉面', '热干面', '炸酱面', '油泼面', '重庆小面', '简单', '汤面', '拌面', '炒面'];
  hotTags.innerHTML = hotSearches.map(t => `<span class="hot-tag" onclick="searchByTag('${t}')">${t}</span>`).join('');
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchInput').value = '';
}

function searchByTag(tag) {
  document.getElementById('searchInput').value = tag;
  doSearch();
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  if (!q) { results.innerHTML = ''; return; }

  const filtered = RECIPES.filter(r =>
    r.name.includes(q) ||
    r.category.includes(q) ||
    r.difficulty.includes(q) ||
    r.ingredients.some(i => i.includes(q))
  );

  if (filtered.length === 0) {
    results.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div>未找到相关教程，试试其他关键词</div></div>';
    return;
  }

  results.innerHTML = filtered.map(r => `
    <div class="t-card" onclick="navigate('detail', {id:${r.id}})">
      <div class="tc-cover recipe-img-bg"><img class="cover-thumb" src="${r.coverImg}" alt="${r.name}" loading="lazy"></div>
      <div class="tc-info">
        <div class="tc-name">${r.name}</div>
        <div class="tc-meta">❤️ ${r.popularity} | ⏱ ${r.duration}分钟 | ${r.difficulty}</div>
        <div class="tc-tags"><span class="tag tag-cat">${r.category}</span></div>
      </div>
    </div>
  `).join('');
}

/* ========================================================================
   个人中心
   ======================================================================== */
function renderProfile() {
  document.getElementById('favCount').textContent = getFavorites().length;
}

function showFavorites() {
  navigate('fav-list', {mode: 'fav'});
}

function showHistory() {
  navigate('fav-list', {mode: 'history'});
}

function renderFavList(mode) {
  const title = document.getElementById('favListTitle');
  const content = document.getElementById('favListContent');
  const back = document.getElementById('favBack');

  if (mode === 'fav') {
    title.textContent = '❤️ 我的收藏';
    const ids = getFavorites();
    const items = RECIPES.filter(r => ids.includes(r.id));
    if (items.length === 0) {
      content.innerHTML = '<div class="empty-state"><div class="empty-icon">💔</div><div>还没有收藏的教程，快去看看吧</div></div>';
    } else {
      content.innerHTML = items.map(r => `
        <div class="t-card" onclick="navigate('detail', {id:${r.id}})">
          <div class="tc-cover recipe-img-bg"><img class="cover-thumb" src="${r.coverImg}" alt="${r.name}" loading="lazy"></div>
          <div class="tc-info">
            <div class="tc-name">${r.name}</div>
            <div class="tc-meta">❤️ ${r.popularity} | ${r.difficulty}</div>
            <div class="tc-tags"><span class="tag tag-cat">${r.category}</span></div>
          </div>
        </div>
      `).join('');
    }
  } else {
    title.textContent = '📖 浏览记录';
    const ids = getHistory();
    const items = RECIPES.filter(r => ids.includes(r.id));
    if (items.length === 0) {
      content.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div>还没有浏览记录</div></div>';
    } else {
      content.innerHTML = items.map(r => `
        <div class="t-card" onclick="navigate('detail', {id:${r.id}})">
          <div class="tc-cover recipe-img-bg"><img class="cover-thumb" src="${r.coverImg}" alt="${r.name}" loading="lazy"></div>
          <div class="tc-info">
            <div class="tc-name">${r.name}</div>
            <div class="tc-meta">❤️ ${r.popularity} | ${r.difficulty}</div>
            <div class="tc-tags"><span class="tag tag-cat">${r.category}</span></div>
          </div>
        </div>
      `).join('');
    }
  }
}

  const list = document.getElementById('tipFullList');
